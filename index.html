<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ことばつなぎ - 言葉の連想・発想ゲーム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        kids: ['"Zen Maru Gothic"', '"Kiwi Maru"', 'sans-serif'],
                    },
                    colors: {
                        kidsBg: '#fef3c7',
                        kidsPanel: '#ffffff',
                    },
                    animation: {
                        'pop-dock': 'popDock 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'bounce-short': 'bounceShort 0.5s ease-in-out',
                        'screen-flash': 'screenFlash 1s ease-out 2',
                    },
                    keyframes: {
                        popDock: {
                            '0%': { opacity: '0', transform: 'scale(0.85) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.8', filter: 'drop-shadow(0 0 10px rgba(56, 189, 248, 0.6))' },
                            '50%': { opacity: '1', filter: 'drop-shadow(0 0 20px rgba(168, 85, 247, 0.8))' },
                        },
                        bounceShort: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        screenFlash: {
                            '0%, 100%': { opacity: '0' },
                            '50%': { opacity: '0.6', backgroundColor: '#fbbf24' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #canvasViewport {
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
        }

        /* Kids Theme Override */
        .kids-theme {
            background-color: #fef3c7 !important;
            color: #1e293b !important;
            font-family: 'Zen Maru Gothic', 'Kiwi Maru', sans-serif !important;
        }
        
        .kids-theme .glass-panel {
            background: #ffffff !important;
            border: 3px solid #fbbf24 !important;
            box-shadow: 0 6px 0 #f59e0b !important;
            color: #1e293b !important;
        }

        .kids-theme section,
        .kids-theme #canvasViewport {
            background-color: #fef08a !important;
        }

        .kids-theme #statusBar {
            background-color: #fde047 !important;
            border-color: #f59e0b !important;
            color: #78350f !important;
        }

        .kids-theme #statusBar strong {
            color: #b45309 !important;
        }

        .kids-theme #wordInput {
            background-color: #ffffff !important;
            color: #1e293b !important;
            border-color: #f59e0b !important;
        }

        .kids-theme #gaugeHeader,
        .kids-theme #sidebarGauges,
        .kids-theme #mainHeader,
        .kids-theme #mainFooter {
            border-color: #f59e0b !important;
        }

        .kids-theme #modeTabContainer,
        .kids-theme #modalModeTabContainer,
        .kids-theme #stageGoalSelector,
        .kids-theme #modalHiraganaPanel {
            background-color: #fffbe2 !important;
            border-color: #f59e0b !important;
        }

        /* Kids mode modal readability fixes */
        .kids-theme #modalHiraTitle {
            color: #92400e !important;
        }

        .kids-theme #modalHiraSub,
        .kids-theme #lblModalGaugeChoose {
            color: #78350f !important;
            font-weight: 700 !important;
        }

        .kids-theme .gauge-box {
            background: #fef08a !important;
            border-color: #f59e0b !important;
        }

        .kids-theme ::-webkit-scrollbar-track {
            background: #fef3c7;
        }
        .kids-theme ::-webkit-scrollbar-thumb {
            background: #f59e0b;
        }

        /* Connected Block Board Effects */
        .docked-block {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }
        
        .kids-theme .docked-block {
            box-shadow: inset 0 0 0 2px #f59e0b;
        }
    </style>
</head>

<body class="h-full antialiased selection:bg-amber-400 selection:text-slate-900 transition-colors duration-500 bg-slate-950 text-slate-100 flex flex-col overflow-hidden" id="appBody">

    <!-- Screen Flash Overlay for Grand Clear -->
    <div id="screenFlashOverlay" class="fixed inset-0 pointer-events-none z-50 opacity-0"></div>

    <header class="w-full z-20 px-2 sm:px-4 py-2 sm:py-3 glass-panel border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 sm:gap-3 transition-all duration-300" id="mainHeader">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-8 h-8 sm:w-11 sm:h-11 rounded-xl sm:rounded-2xl bg-gradient-to-tr from-amber-400 via-rose-500 to-indigo-600 flex items-center justify-center text-slate-900 font-extrabold text-lg sm:text-2xl shadow-lg shadow-amber-500/20" id="headerIcon">
                <i class="fa-solid fa-cubes text-white text-xs sm:text-base"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-pink-400 to-sky-400" id="headerTitle">
                    ことばつなぎ
                </h1>
                <p class="text-[10px] sm:text-xs text-slate-400 hidden xs:block sm:block" id="headerSubtitle">連想をつないで大きなブロックを広げよう！</p>
            </div>
        </div>

        <!-- Mode Select Tabs -->
        <div class="flex items-center bg-slate-900/90 p-1 sm:p-1.5 rounded-xl sm:rounded-2xl border border-slate-800 scale-95 sm:scale-100" id="modeTabContainer">
            <button onclick="switchMode('adult')" id="tab-adult" class="px-2 py-1 sm:px-3.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-bold transition-all flex items-center gap-1 bg-amber-400 text-slate-950 shadow-md">
                <i class="fa-solid fa-user-gear text-[10px] sm:text-xs"></i> <span id="labelTabAdult">おとな</span>
            </button>
            <button onclick="switchMode('kids')" id="tab-kids" class="px-2 py-1 sm:px-3.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-bold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1">
                <i class="fa-solid fa-face-smile text-[10px] sm:text-xs"></i> <span id="labelTabKids">こども</span>
            </button>
            <button onclick="switchMode('timer')" id="tab-timer" class="px-2 py-1 sm:px-3.5 sm:py-1.5 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-bold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1">
                <i class="fa-solid fa-stopwatch text-[10px] sm:text-xs"></i> <span id="labelTabTimer">タイム</span>
            </button>
        </div>

        <!-- Stage Goal Count Selector -->
        <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs font-bold" id="stageGoalSelector">
            <button onclick="setStageCount(5)" id="btnStage5" class="px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg transition-all text-slate-400">5つ</button>
            <button onclick="setStageCount(10)" id="btnStage10" class="px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg transition-all bg-amber-400 text-slate-950">10つ</button>
        </div>

        <!-- Header Action Controls -->
        <div class="flex items-center gap-2">
            <button onclick="confirmReset()" class="p-2 sm:p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 hover:text-rose-300 transition-colors border border-slate-700/50 text-xs sm:text-base" title="最初からあそぶ">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-row">

        <!-- LEFT SIDEBAR: Dynamic Gauge Progression Bars -->
        <aside class="w-16 sm:w-32 md:w-36 z-10 glass-panel border-r border-slate-800/80 p-1.5 sm:p-3 flex flex-col justify-between gap-2 shrink-0 transition-colors duration-300" id="sidebarGauges">
            <div class="text-center pb-1.5 sm:pb-2 border-b border-slate-800/60" id="gaugeHeader">
                <div class="text-[9px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider hidden sm:block" id="gaugeMainTitle">PROGRESS</div>
                <div class="text-[10px] sm:text-sm font-black text-amber-400 truncate" id="gaugeSubTitle">Stg 1/10</div>
            </div>

            <!-- Gauge Container -->
            <div class="flex-1 flex flex-col-reverse justify-between gap-1 py-1 overflow-y-auto" id="gaugesList">
                <!-- Javascript dynamically builds gauge items -->
            </div>

            <div class="pt-1.5 sm:pt-2 border-t border-slate-800/60 text-center">
                <div class="text-[9px] sm:text-[10px] text-slate-400 truncate" id="lblStageSynchro">シンクロ点</div>
                <div class="text-xs sm:text-base font-black text-sky-400 truncate" id="gaugeCurrentScore">0/1000</div>
            </div>
        </aside>

        <!-- RIGHT AREA: Main Interactive Connected Blocks Canvas -->
        <section class="flex-1 flex flex-col relative overflow-hidden bg-slate-950/60">

            <!-- Timer Countdown Line -->
            <div id="timerContainer" class="w-full bg-slate-900 h-2.5 hidden relative overflow-hidden border-b border-slate-800">
                <div id="timerBar" class="h-full bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 w-full transition-all duration-100 ease-linear"></div>
            </div>

            <!-- Info & Status Bar -->
            <div class="px-2 sm:px-4 py-1.5 sm:py-2 bg-slate-900/80 border-b border-slate-800/50 flex items-center justify-between text-[11px] sm:text-xs text-slate-400 z-10" id="statusBar">
                <div class="flex items-center gap-2 sm:gap-3 truncate">
                    <span id="lblActiveNode" class="truncate">選択中: <strong id="selectedNodeWord" class="text-sky-400 font-bold">---</strong></span>
                    <span id="lblTotalChain" class="shrink-0">連想: <strong id="totalChainCount" class="text-indigo-400 font-bold">0</strong>個</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[10px] sm:text-xs text-slate-400" id="lblStageTargetBadge">目標: <span id="lblMaxGaugeCount" class="text-amber-400 font-bold">10</span></span>
                </div>
            </div>

            <!-- Interactive Connected Blocks Workspace -->
            <div id="canvasViewport" class="flex-1 w-full h-full relative overflow-auto select-none p-2 sm:p-4">
                <div id="nodeGraphContainer" class="relative w-full min-h-full">
                    <!-- Dynamic Blocks Cluster Container -->
                    <div id="nodesContainer" class="relative w-full"></div>
                </div>
            </div>

            <!-- Toast Score/Feedback Alert Popup -->
            <div id="praiseToast" class="absolute top-12 left-1/2 transform -translate-x-1/2 z-30 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-15px]">
                <div class="bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 text-slate-950 font-black px-4 sm:px-6 py-2 sm:py-3 rounded-full shadow-2xl flex items-center gap-2 sm:gap-3 border-2 border-white text-xs sm:text-base animate-bounce-short" id="praiseToastContent">
                    <i class="fa-solid fa-bolt text-amber-100 text-base sm:text-xl"></i>
                    <span id="praiseMessage">シンクロ率 +120点！</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="w-full z-20 glass-panel border-t border-slate-800 p-3 sm:p-4 transition-colors duration-300" id="mainFooter">
        <div class="max-w-4xl mx-auto flex flex-col gap-2.5">

            <!-- AI Hint Chips Area -->
            <div id="aiHintsArea" class="flex items-center gap-2 overflow-x-auto pb-1 text-xs text-slate-400 min-h-[28px]">
                <span class="shrink-0 flex items-center gap-1 font-bold text-sky-400" id="lblAiHintTag">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> ヒント:
                </span>
                <div id="hintsContainer" class="flex items-center gap-2">
                    <span class="text-slate-500 italic" id="lblHintInstruction">「ヒント」をおすとアイデアがでます</span>
                </div>
            </div>

            <!-- Main Form Input -->
            <form id="associationForm" onsubmit="handleWordSubmit(event)" class="flex items-center gap-2">
                <div class="hidden sm:flex items-center gap-1.5 px-3 py-2.5 bg-slate-900 rounded-2xl border border-slate-800 text-xs shrink-0" id="inputTargetBadge">
                    <span class="text-slate-500" id="lblParentPrefix">もと:</span>
                    <span id="activeParentText" class="font-bold text-amber-400 max-w-[90px] truncate">---</span>
                </div>

                <div class="relative flex-1">
                    <input type="text" id="wordInput" 
                           placeholder="" 
                           autocomplete="off"
                           class="w-full bg-slate-900/90 border-2 border-slate-700 focus:border-amber-400 rounded-2xl px-4 py-3 text-sm sm:text-base text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400/30 transition-all font-sans" />
                    
                    <button type="button" onclick="getAIHintsForCurrentNode()" id="btnGetHint" class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs font-bold border border-amber-500/40 transition-all flex items-center gap-1">
                        <i class="fa-solid fa-lightbulb"></i> <span id="lblHintBtnText">ヒント</span>
                    </button>
                </div>

                <button type="submit" id="btnSubmit" class="px-6 sm:px-8 py-3 rounded-2xl bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 hover:from-amber-300 hover:to-rose-400 text-slate-950 font-black text-sm sm:text-base shadow-lg shadow-amber-500/25 active:scale-95 transition-all shrink-0 flex items-center gap-2">
                    <span id="btnSubmitText">つなぐ</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </footer>

    <!-- Initial 1-Character Hiragana Modal -->
    <div id="hiraganaModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl max-w-md w-full p-5 sm:p-8 text-center shadow-2xl animate-pop-dock relative overflow-hidden max-h-[90vh] overflow-y-auto" id="modalHiraganaPanel">
            
            <!-- Modal Mode Tabs -->
            <div class="flex justify-center items-center bg-slate-950/80 p-1 rounded-2xl mb-4 border border-slate-800 scale-95 sm:scale-100" id="modalModeTabContainer">
                <button type="button" onclick="switchMode('adult')" id="modal-tab-adult" class="px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 bg-amber-400 text-slate-950 shadow-md">
                    <i class="fa-solid fa-user-gear"></i> <span>おとな</span>
                </button>
                <button type="button" onclick="switchMode('kids')" id="modal-tab-kids" class="px-2.5 py-1.5 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1">
                    <i class="fa-solid fa-face-smile"></i> <span>こども</span>
                </button>
                <button type="button" onclick="switchMode('timer')" id="modal-tab-timer" class="px-2.5 py-1.5 rounded-xl text-xs font-bold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-1">
                    <i class="fa-solid fa-stopwatch"></i> <span>タイム</span>
                </button>
            </div>

            <!-- Stage Count Choice in Modal -->
            <div class="mb-4 sm:mb-5 flex justify-center items-center gap-2 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800/80">
                <span class="text-xs font-bold text-slate-400" id="lblModalGaugeChoose">ゲージ数:</span>
                <button type="button" onclick="setStageCount(5)" id="modalBtnStage5" class="px-3 py-1 rounded-xl text-xs font-bold transition-all text-slate-400">5つ</button>
                <button type="button" onclick="setStageCount(10)" id="modalBtnStage10" class="px-3 py-1 rounded-xl text-xs font-bold transition-all bg-amber-400 text-slate-950">10つ</button>
            </div>

            <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 text-slate-950 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/30">
                <span class="font-kids text-2xl sm:text-4xl font-black text-slate-950 select-none">あ</span>
            </div>

            <h2 class="text-xl sm:text-2xl font-black text-white mb-2" id="modalHiraTitle">はじめの「ひらがな1文字」</h2>
            <p class="text-xs sm:text-sm text-slate-400 mb-4 sm:mb-6" id="modalHiraSub">好きなひらがなを1文字いれてね！<br>その文字から始まる単語でゲームがスタートします。</p>

            <form onsubmit="handleHiraganaSubmit(event)" class="space-y-4">
                <input type="text" id="hiraganaInput" maxlength="1" placeholder="" 
                       class="w-20 h-20 sm:w-24 sm:h-24 mx-auto text-center text-3xl sm:text-4xl font-black bg-slate-950 border-4 border-amber-400 focus:border-sky-400 rounded-2xl sm:rounded-3xl text-amber-300 focus:outline-none shadow-inner block uppercase font-sans" required />
                
                <button type="submit" class="w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 hover:from-amber-300 hover:to-rose-400 text-slate-950 font-black text-base sm:text-lg shadow-xl shadow-amber-500/30 active:scale-95 transition-all" id="btnHiraStart">
                    この文字でスタート！
                </button>
            </form>
        </div>
    </div>

    <!-- Stage Clear Modal -->
    <div id="stageClearModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto hidden">
        <div class="bg-slate-900 border-2 border-emerald-400 rounded-3xl max-w-md w-full p-5 sm:p-6 text-center shadow-2xl animate-pop-dock max-h-[90vh] overflow-y-auto">
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-3 sm:mb-4 text-3xl sm:text-4xl border border-emerald-500/40">
                <i class="fa-solid fa-flag-checkered"></i>
            </div>

            <h2 class="text-xl sm:text-3xl font-black text-white mb-1" id="lblStageClearTitle">ゲージ 1個達成！</h2>
            <p class="text-xs text-slate-400 mb-6" id="lblStageClearSub">シンクロ率 1000点突破！次のゲージに挑戦しよう！</p>

            <button onclick="startNextStage()" class="w-full py-3.5 sm:py-4 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black text-base sm:text-lg shadow-lg shadow-emerald-500/25 active:scale-95 transition-all" id="btnNextStage">
                つぎのステージへ
            </button>
        </div>
    </div>

    <!-- Grand Game Clear Modal -->
    <div id="gameClearModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto hidden">
        <div class="bg-gradient-to-b from-slate-900 via-slate-900 to-amber-950 border-4 border-amber-400 rounded-3xl max-w-lg w-full p-6 sm:p-8 text-center shadow-2xl animate-pop-dock relative overflow-hidden max-h-[90vh] overflow-y-auto">
            
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-gradient-to-tr from-amber-300 via-amber-500 to-orange-600 text-slate-950 flex items-center justify-center mx-auto mb-4 sm:mb-5 text-4xl sm:text-5xl shadow-2xl shadow-amber-500/50 animate-bounce-short">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <h2 class="text-xl sm:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-orange-400 to-yellow-200 mb-2" id="lblGameClearHeader">
                お疲れ様でした！
            </h2>
            <p class="text-xs sm:text-base text-amber-200 font-bold mb-4 sm:mb-6" id="lblGameClearSub">
                全10ゲージクリア！素晴らしい発想力です！
            </p>

            <div class="bg-slate-950/80 p-4 sm:p-5 rounded-2xl border border-amber-500/30 mb-5 sm:mb-6 space-y-2 sm:space-y-3">
                <div class="flex justify-between items-center text-xs sm:text-base">
                    <span class="text-slate-400" id="lblTotalScoreTag">合計シンクロ率:</span>
                    <span class="text-xl sm:text-2xl font-black text-amber-400" id="finalTotalScore">10,000 pt</span>
                </div>
                <div class="flex justify-between items-center text-xs sm:text-sm">
                    <span class="text-slate-400" id="lblTotalChainTag">つないだ言葉の数:</span>
                    <span class="font-bold text-sky-400" id="finalTotalWords">0 個</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 sm:gap-3">
                <button onclick="confirmReset()" class="py-3 sm:py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 hover:from-amber-300 hover:to-rose-400 text-slate-950 font-black text-sm sm:text-base shadow-xl shadow-amber-500/30 active:scale-95 transition-all" id="btnGameRestart">
                    さいしょから
                </button>
                <button onclick="closeGameClearModal()" class="py-3 sm:py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm sm:text-base border border-slate-700 active:scale-95 transition-all" id="btnGameFinish">
                    おわり
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'adult'; // 'adult' | 'kids' | 'timer'
        let currentStage = 1;
        let maxStages = 10; // 5 or 10

        function calculateConnectedBlockPosition(index, viewportWidth) {
            const padding = 16;
            const availWidth = Math.max(180, viewportWidth - padding);
            
            let cols = 2;
            if (availWidth >= 640) cols = 5;
            else if (availWidth >= 480) cols = 4;
            else if (availWidth >= 340) cols = 3;
            else cols = 2;

            const gap = 6;
            const cardWidth = Math.floor((availWidth - (gap * (cols - 1))) / cols);
            const cardHeight = Math.max(50, Math.min(64, Math.floor(cardWidth * 0.55)));

            const row = Math.floor(index / cols);
            const colInRow = index % cols;

            const isEvenRow = row % 2 === 0;
            const col = isEvenRow ? colInRow : (cols - 1 - colInRow);

            const x = col * (cardWidth + gap);
            const y = row * (cardHeight + gap);

            return { x, y, cols, row, isEvenRow, cardWidth, cardHeight, gap };
        }

        function getWordFontSizeStyle(word, cardWidth = 100) {
            const len = word.length;
            const scale = cardWidth / 110;
            
            let baseSize = 13;
            if (len <= 3) baseSize = 13;
            else if (len <= 5) baseSize = 11.5;
            else if (len <= 7) baseSize = 10;
            else if (len <= 9) baseSize = 9;
            else baseSize = 8;

            const finalSize = Math.max(7.5, Math.round(baseSize * scale * 10) / 10);
            return `font-size: ${finalSize}px; line-height: 1.1;`;
        }

        function renderGraph() {
            const container = document.getElementById('nodesContainer');
            const viewport = document.getElementById('canvasViewport');
            if (!container || !viewport) return;
            
            container.innerHTML = '';

            const viewportWidth = viewport.clientWidth || 300;
            const calculatedPositions = [];

            nodes.forEach((node, index) => {
                const pos = calculateConnectedBlockPosition(index, viewportWidth);
                node.x = pos.x;
                node.y = pos.y;
                node.cardWidth = pos.cardWidth;
                node.cardHeight = pos.cardHeight;
                node.row = pos.row;
                node.col = pos.col;
                node.isEvenRow = pos.isEvenRow;
                calculatedPositions.push(pos);
            });

            const maxRow = calculatedPositions.length > 0 ? calculatedPositions[calculatedPositions.length - 1].row : 0;
            const lastPos = calculatedPositions[calculatedPositions.length - 1];
            const cardHeight = lastPos ? lastPos.cardHeight : 52;
            const gap = lastPos ? lastPos.gap : 6;
            const totalHeight = Math.max(300, (maxRow + 1) * (cardHeight + gap) + 30);
            document.getElementById('nodeGraphContainer').style.height = `${totalHeight}px`;

            nodes.forEach((node, index) => {
                const isSelected = node.id === selectedNodeId;

            const entry = HIRAGANA_DICTIONARY[char];
            let startWord = char;

            } else {
                startWord = char;

            nodes = [];
            const rootNode = {

                parentId: null,
                score: 0
            };

            nodes.push(rootNode);
            selectedNodeId = rootNode.id;

        function handleWordSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('wordInput');
            if (!input) return;

            const newWord = input.value.trim();
            if (!newWord) return;

            const activeNode = nodes.find(n => n.id === selectedNodeId);
            const parentWord = activeNode ? activeNode.word : '';

            const score = checkAssociation(parentWord, newWord);

            const newNode = {
                id: 'node_' + (nodes.length + 1),
                word: newWord,
                parentId: selectedNodeId,
                score: score
            };

            nodes.push(newNode);
            selectedNodeId = newNode.id;

            stageSynchroScore += score;
            totalWordsCount++;

            input.value = '';

            showPraiseToast(score);
            renderGraph();
            renderGaugesSidebar();
            updateStatsUI();

            if (currentMode === 'timer') resetTimer();

            if (stageSynchroScore >= STAGE_GOAL_SCORE) {
                stopTimer();
                if (currentStage >= maxStages) {
                    triggerGrandClear();
                } else {
                    document.getElementById('stageClearModal').classList.remove('hidden');
                }
            }
        }

        function checkAssociation(parentWord, newWord) {
            const baseScore = Math.floor(Math.random() * 50) + 80;
            const lengthBonus = Math.min(40, newWord.length * 8);
            return baseScore + lengthBonus;
        }

            msgEl.textContent = `${randomPraise} (+${score}${scoreUnit})`;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-15px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-15px]');
            }, 1800);
        }

        function checkAssociation(parentWord, newWord) {
            if (!parentWord || !newWord) return 100;

            let syncRate = 100;
            const parent = parentWord.trim();
            const current = newWord.trim();

            // 1. 完全一致（同一単語）は連想としての評価を50%に制限
            if (parent === current) {
                return 50;
            }

            // 2. 共通文字（漢字・ひらがな）の重複率評価
            let commonChars = 0;
            const parentChars = new Set(parent.split(''));
            for (const char of current) {
                if (parentChars.has(char)) {
                    commonChars++;
                }
            }
            const charOverlapRatio = commonChars / Math.max(parent.length, current.length);
            syncRate += Math.floor(charOverlapRatio * 50);

            // 3. しりとり・音のつながり（末尾文字と先頭文字の一致）
            const lastCharParent = parent.slice(-1);
            const firstCharCurrent = current.charAt(0);
            if (lastCharParent === firstCharCurrent) {
                syncRate += 30;
            }

            // 4. 連想概念カテゴリのマッチング精査
            const categoryMatchBonus = getCategoryAssociationBonus(parent, current);
            syncRate += categoryMatchBonus;

            // 5. 単語の長さと適正評価（1文字は軽微減点、2〜6文字は加点）
            if (current.length >= 2 && current.length <= 6) {
                syncRate += 15;
            } else if (current.length === 1) {
                syncRate -= 15;
            }

            // 6. ランダムな発想・ひらめき評価（±15%）
            const randomness = Math.floor(Math.random() * 31) - 15;
            syncRate += randomness;

            // 50%〜200% の範囲に確実に収める
            return Math.max(50, Math.min(200, syncRate));
        }

        function getAIHintsForCurrentNode() {
            const activeNode = nodes.find(n => n.id === selectedNodeId);
            const word = activeNode ? activeNode.word : 'ひらめき';

            const mockHints = currentMode === 'kids' 
                ? [`${word}のともだち`, `${word}のたべもの`, `${word}のあそび`]
                : [`${word}の関連語`, `${word}からの連想`, `${word}の場所`];

            const hintsContainer = document.getElementById('hintsContainer');
            if (!hintsContainer) return;

            hintsContainer.innerHTML = '';
            mockHints.forEach(hint => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = "px-2.5 py-1 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 text-xs font-bold border border-sky-500/40 transition-all truncate max-w-[120px]";
                chip.textContent = hint;
                chip.onclick = () => {
                    const input = document.getElementById('wordInput');
                    if (input) {
                        input.value = hint;
                        input.focus();
                    }
                };
                hintsContainer.appendChild(chip);
            });
        }

        function startNextStage() {
            currentStage++;
            stageSynchroScore = 0;
            document.getElementById('stageClearModal').classList.add('hidden');
            renderGaugesSidebar();
            showHiraganaModal();
        }

        function confirmReset() {
            currentStage = 1;
            stageSynchroScore = 0;
            totalWordsCount = 0;

            document.getElementById('stageClearModal').classList.add('hidden');
            document.getElementById('gameClearModal').classList.add('hidden');

            renderGaugesSidebar();
            showHiraganaModal();
        }

        function triggerGrandClear() {
            const confettiFunc = window.confetti;
            if (typeof confettiFunc === 'function') {
                confettiFunc({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                setTimeout(() => confettiFunc({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } }), 300);
                setTimeout(() => confettiFunc({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } }), 600);
            }

            const flash = document.getElementById('screenFlashOverlay');
            if (flash) {
                flash.classList.add('animate-screen-flash');
                setTimeout(() => flash.classList.remove('animate-screen-flash'), 2000);
            }

            document.getElementById('finalTotalScore').textContent = currentMode === 'kids' ? `${currentStage * 1000} 点` : `${(currentStage * 1000).toLocaleString()} pt`;
            document.getElementById('finalTotalWords').textContent = `${totalWordsCount} 個`;

            document.getElementById('gameClearModal').classList.remove('hidden');
        }

        function closeGameClearModal() {
            document.getElementById('gameClearModal').classList.add('hidden');
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    stopTimer();
                    const input = document.getElementById('wordInput');
                    if (input && input.value.trim()) {
                        handleWordSubmit(new Event('submit'));
                    } else {
                        resetTimer();
                    }
                }
                updateTimerBar();
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            timeLeft = TIMER_DURATION;
            updateTimerBar();
            if (currentMode === 'timer') startTimer();
        }

        function updateTimerBar() {
            const bar = document.getElementById('timerBar');
            if (bar) {
                const percent = Math.max(0, (timeLeft / TIMER_DURATION) * 100);
                bar.style.width = `${percent}%`;
            }
        }
    </script>
</body>
